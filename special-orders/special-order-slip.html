    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Special Order Slip — KNFC<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8097c2b7-f753-4d87-8e39-88613085f7bc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8f2b11e3-65ea-46a9-8363-f3615782a85d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9a95c15a-cd3b-4ac2-999c-b1dab23e781f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ccbdad2a-0776-4c43-97de-edde6b92285a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* Digital Special Order Slip — styles\n   Deliberately plain. This is the paper card on a screen, nothing more. */\n:root{--ink:#1a1a1a;--gray:#6b6b6b;--line:#9a9a9a;--rule:#d8d4cc;--paper:#fbfaf7;--card:#fff;--maroon:#7a2230;--shade:#f2efe9;--f-type:\"Courier Prime\",\"Courier New\",Courier,monospace;--f-ui:ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Helvetica,sans-serif}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}\n.wrap{max-width:940px;margin:0 auto;padding:22px 18px 70px}\na{color:var(--maroon)}a:hover{color:#5d1a25}\n\n/* ── masthead + tabs ─────────────────────────────── */\n.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:2px}\n.mast h1{font-family:var(--f-type);font-size:21px;font-weight:700;letter-spacing:.04em;margin:0;text-transform:uppercase}\n.mast p{margin:5px 0 0;font-size:13px;color:var(--gray);max-width:56ch}\n.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:24px}\n.tab{font:inherit;font-size:14px;padding:11px 17px;background:none;border:none;border-bottom:2px solid transparent;color:var(--gray);cursor:pointer;margin-bottom:-1px}\n.tab:hover{color:var(--ink)}\n.tab.on{color:var(--ink);border-bottom-color:var(--maroon);font-weight:600}\n.tab .n{font-family:var(--f-type);font-size:12px;color:var(--gray);margin-left:6px}\n\n/* ── the slip ────────────────────────────────────── */\n.slip{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 var(--rule);padding:26px 28px 22px;font-family:var(--f-type)}\n.memb{display:flex;justify-content:flex-end;align-items:baseline;gap:10px;margin-bottom:14px}\n.memb label{font-size:14px}\n/* Each printed line on the card: a label, then a rule you write on. */\n.ln{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;margin-bottom:13px}\n.ln>label{font-size:14px;white-space:nowrap}\n.ln .fill{flex:1 1 120px;min-width:90px}\n.ln .fill.sm{flex:0 1 108px;min-width:70px}\n.ln .fill.md{flex:0 1 190px;min-width:120px}\ninput[type=text],input[type=date],input[type=number],textarea,select{font-family:var(--f-type);font-size:15px;color:var(--ink);width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:2px 3px 3px;border-radius:0}\ninput:focus,textarea:focus,select:focus{outline:none;border-bottom-color:var(--maroon);background:#fffdf6}\ninput[type=date]{font-size:14px}\ntextarea{resize:vertical;min-height:2.6em;border:1px solid var(--line);padding:6px 7px}\n.buyerbar{font-family:var(--f-type);font-size:14px;font-weight:700;letter-spacing:.22em;text-align:center;text-transform:uppercase;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:7px 0;margin:22px 0 18px}\n\n/* ── back-of-card ledger ─────────────────────────── */\n.back{margin-top:26px;border-top:1px dashed var(--line);padding-top:18px}\n.back h3{font-family:var(--f-type);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 3px}\n.back .hint{font-family:var(--f-ui);font-size:12.5px;color:var(--gray);margin:0 0 12px}\ntable.led{width:100%;border-collapse:collapse;font-family:var(--f-type)}\ntable.led th{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-align:left;color:var(--ink);border-bottom:1px solid var(--ink);padding:0 7px 6px}\ntable.led td{border:1px solid var(--rule);border-top:none;padding:0}\ntable.led td input{border:none;padding:8px 7px}\ntable.led td input:focus{background:#fffdf6}\ntable.led tr td:first-child{border-left:none}\ntable.led tr td:last-child{border-right:none}\n\n/* ── list of slips ───────────────────────────────── */\n.searchrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}\n.searchrow .f{flex:1 1 240px}\n.searchrow label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin-bottom:4px}\n.searchrow input{border:1px solid var(--line);padding:8px 9px;font-family:var(--f-ui)}\n.rows{border-top:1px solid var(--rule)}\n.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:6px 16px;align-items:center;width:100%;text-align:left;font:inherit;background:none;border:none;border-bottom:1px solid var(--rule);padding:13px 4px;cursor:pointer}\n.row:hover{background:var(--shade)}\n.row .who{display:block;font-weight:600}\n.row .meta{display:block;font-family:var(--f-type);font-size:12.5px;color:var(--gray);margin-top:2px}\n.row .what{display:block;font-size:14px}\n.row .sub{display:block;font-family:var(--f-type);font-size:12.5px;color:var(--gray);margin-top:2px}\n.row .stat{font-family:var(--f-type);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--gray);white-space:nowrap;justify-self:end}\n.empty{padding:34px 4px;color:var(--gray);font-size:14px}\n\n/* ── buttons ─────────────────────────────────────── */\n.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}\n.btn{font:inherit;font-size:14px;padding:9px 17px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}\n.btn:hover{background:#000}\n.btn.ghost{background:none;color:var(--ink)}\n.btn.ghost:hover{background:var(--shade)}\n.btn.quiet{border-color:var(--rule);color:var(--gray);background:none}\n.btn.quiet:hover{color:var(--maroon);border-color:var(--maroon);background:none}\n.saved{font-family:var(--f-type);font-size:13px;color:var(--gray)}\n.backlink{font:inherit;font-size:13.5px;background:none;border:none;color:var(--maroon);padding:0;margin-bottom:16px;cursor:pointer}\n.backlink:hover{text-decoration:underline}\n.note{font-size:13px;color:var(--gray);border-left:2px solid var(--rule);padding:2px 0 2px 12px;margin-top:26px}\n@media print{.tabs,.bar,.backlink,.searchrow,.note{display:none}.slip{border:none;box-shadow:none;padding:0}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"slip-root\"><\u002Fdiv>\n<script src=\"08f814d9-1eb7-496b-a708-45468fc2ab25\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
